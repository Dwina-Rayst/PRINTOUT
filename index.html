<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PRINTOUT</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="icon" href="data:,">
</head>
<body>

  <!-- ===================== 캔버스 ===================== -->
  <canvas id="game-canvas"></canvas>

  <!-- ===================== 타이틀 / 로그인 ===================== -->
  <div id="screen-auth" class="screen">
    <div class="noise-overlay"></div>
    <h1 class="title-glitch" data-text="PRINTOUT">PRINTOUT</h1>
    <p class="subtitle">이 타워는 기계를 '번식'시키는 곳입니다.</p>

    <div class="auth-box">
      <div class="tabs">
        <button id="tab-login" class="tab active">로그인</button>
        <button id="tab-signup" class="tab">회원가입</button>
      </div>
      <input id="auth-id" type="text" placeholder="아이디(닉네임)" maxlength="16" />
      <input id="auth-pw" type="password" placeholder="비밀번호" maxlength="32" />
      <button id="auth-submit" class="btn-primary">로그인</button>
      <p id="auth-error" class="error-text"></p>
      <p class="hint">서버 연결 실패 시 오프라인(로컬) 모드로 자동 전환됩니다. 비밀번호는 해시로 저장되며 데이터 변조 시 자동 감지됩니다.</p>
    </div>
  </div>

  <!-- ===================== 성별 선택 ===================== -->
  <div id="screen-gender" class="screen hidden">
    <div class="noise-overlay"></div>
    <h2>아바타를 선택하세요</h2>
    <div class="gender-select">
      <button class="gender-card" data-gender="male">
        <div class="gender-icon">♂</div>
        <span>남자</span>
      </button>
      <button class="gender-card" data-gender="female">
        <div class="gender-icon">♀</div>
        <span>여자</span>
      </button>
    </div>
  </div>

  <!-- ===================== 인트로 컷씬 ===================== -->
  <div id="screen-cutscene" class="screen hidden">
    <div id="cutscene-canvas-wrap"></div>
    <div class="cutscene-text-box">
      <p id="cutscene-line"></p>
    </div>
    <button id="cutscene-skip" class="btn-skip">SKIP ▶</button>
  </div>

  <!-- ===================== 게임 HUD ===================== -->
  <div id="hud" class="hidden">
    <div class="hud-top-left">
      <div class="floor-counter">FLOOR <span id="hud-floor">1</span> / 4444</div>
      <div id="grace-timer" class="grace-timer hidden"></div>
      <div class="stat-bar hp-bar">
        <div class="stat-fill" id="hud-hp-fill"></div>
        <span class="stat-label" id="hud-hp-text">80 / 100</span>
      </div>
      <div class="stat-line">공격력 <span id="hud-atk">0</span> · 방어력 <span id="hud-def">0</span></div>
    </div>

    <div class="hud-top-right">
      <button id="btn-inventory" class="icon-btn" title="인벤토리 (I)">🎒</button>
    </div>

    <div id="boss-hud" class="boss-hud hidden">
      <div class="boss-name" id="boss-name">???</div>
      <div class="stat-bar boss-bar"><div class="stat-fill" id="boss-hp-fill"></div></div>
    </div>

    <div id="damage-flash"></div>
    <div id="crosshair">+</div>
    <div id="interact-prompt" class="hidden">F : 상호작용</div>
    <div id="toast-container"></div>
  </div>

  <!-- ===================== 인벤토리 / 휴대폰 ===================== -->
  <div id="screen-inventory" class="screen hidden overlay-screen">
    <div class="inventory-box">
      <div class="inv-tabs">
        <button id="inv-tab-items" class="tab active">인벤토리</button>
        <button id="inv-tab-phone" class="tab">📱 휴대폰</button>
      </div>
      <div id="inv-panel-items" class="inv-panel">
        <p class="inv-desc">현재 무기: <span id="inv-weapon">맨손</span></p>
        <p class="inv-desc">누적 방어구 강화: <span id="inv-armor-count">0</span>개</p>
        <p class="hint">고물 더미에 가까이 가서 F 를 눌러 아이템을 획득하세요.</p>
      </div>
      <div id="inv-panel-phone" class="inv-panel hidden">
        <div id="phone-messages"></div>
      </div>
      <button id="inv-close" class="btn-secondary">닫기 (I)</button>
    </div>
  </div>

  <!-- ===================== 사망 / 게임오버 ===================== -->
  <div id="screen-gameover" class="screen hidden">
    <div class="noise-overlay"></div>
    <h1 class="title-glitch red" data-text="ANOTHER PRINT">ANOTHER PRINT</h1>
    <p id="gameover-floor">도달 층: 1</p>
    <button id="btn-restart" class="btn-primary">다시 시도</button>
  </div>

  <!-- ===================== 클리어 ===================== -->
  <div id="screen-victory" class="screen hidden">
    <h1 class="title-glow">PROCESS ABORTED</h1>
    <p>당신은 출력되지 않았습니다.</p>
    <button id="btn-restart2" class="btn-primary">다시 시작</button>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
